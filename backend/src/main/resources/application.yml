spring:
  application:
    name: ml-it-backend
  profiles:
    default: dev
  main:
    banner-mode: off
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-swallow-size: 64KB
    max-http-form-post-size: 16KB

app:
  version: ${APP_VERSION:dev}
  security:
    allowed-origins: []
    allowed-methods: [GET, HEAD, OPTIONS]
    max-request-bytes: 16384
  rate-limit:
    enabled: true
    max-requests: 60
    window: 1m

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
